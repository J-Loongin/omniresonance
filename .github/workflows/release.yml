name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Prepare version-matched release bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./gradlew --no-daemon --console=plain prepareReleaseBundle -PreleaseTag="$RELEASE_TAG"
      - name: Verify checksums
        working-directory: build/release
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: build/release/
          if-no-files-found: error
          retention-days: 7
      - name: Publish new tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          release_version="${RELEASE_TAG#v}"
          if [[ "${release_version%%+*}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            "${prerelease[@]}" build/release/*.jar build/release/LICENSE build/release/README.md build/release/SHA256SUMS
